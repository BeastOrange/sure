          cooldown: "请等待 30 秒后再发送测试。"
          disabled: "运营方已禁用推送送达。"
          enqueue_failed: "无法将测试加入队列。请检查 Sidekiq，然后刷新下方结果。"
          hosted_only: "推送通知仅在托管模式下可用。"
          ineligible: "只有处于活动状态的超级管理员可以发送测试通知。"
