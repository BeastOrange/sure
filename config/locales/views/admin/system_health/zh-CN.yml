    system_health:
      push_notification:
        body: "这是发给你 Sure 账户的测试推送通知。"
        title: "Sure 测试通知"
      push_notifications:
        columns:
          checked_at: "最近更新"
          device: "设备"
          environment: "APNs 环境"
          status: "结果"
