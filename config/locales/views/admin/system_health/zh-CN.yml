          not_configured: "尚未配置 APNs 凭证。"
          queued: "测试通知已加入队列。请刷新下方结果查看状态。"
          ready: "向账户已注册的 iOS 设备发送测试通知。"
          storage_unavailable: "无法保存测试请求。请检查共享缓存配置。"
