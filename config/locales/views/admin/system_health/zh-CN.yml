        send_test: "发送测试推送通知"
        statuses:
          accepted: "APNs 已接受"
          enqueue_failed: "无法加入队列；请检查 Sidekiq"
          expired: "已过期，没有最终结果"
          failed: "失败；请检查推送调试日志"
          queued: "已排队"
          rejected: "APNs 已拒绝；请检查推送调试日志"
          retrying: "正在重试临时故障"
          skipped: "已跳过：不再符合条件"
          unregistered: "设备注册已失效"
        title: "推送通知"
      show:
        ai:
          adapters:
            openai: "OpenAI 托管向量存储"
            pgvector: "pgvector"
            qdrant: "Qdrant"
          alerts:
            custom_openai:
              message: "配置的端点未通过 /v1/vector_stores 存活检查。大多数本地及兼容 OpenAI 的端点不支持该 API。聊天和 PDF 处理仍可能正常；常见的本地配置方式是使用 pgvector 和单独的嵌入端点。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "托管向量存储在此自定义端点检查失败。"
            embedding_dimensions_mismatch:
              message: "嵌入端点返回的向量长度与 EMBEDDING_DIMENSIONS 不符。请按模型文档中的向量维度设置 EMBEDDING_MODEL 和 EMBEDDING_DIMENSIONS，然后重启 Sure 使环境变量在所有进程中生效。若已有数据使用不同维度，还需修改或重建 pgvector 嵌入列/表，并重新生成文档嵌入。"
              title: "嵌入向量维度不匹配"
            embedding_probe_failed:
              message: "Sure 无法通过所配置的端点和模型创建简短测试嵌入。请检查 EMBEDDING_URI_BASE、EMBEDDING_MODEL、EMBEDDING_ACCESS_TOKEN 和嵌入提供商日志。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "嵌入实时检查失败"
            embedding_probe_timeout:
              message: "嵌入端点未在 AI_HEALTH_PROBE_TIMEOUT 设定时间内响应。如果提供商响应较慢，请提高此健康检查超时时间并重启 Sure，使所有进程采用新环境变量。如果普通 AI 聊天请求也超时，请另行提高 OPENAI_REQUEST_TIMEOUT。"
              title: "嵌入实时检查超时"
            function_calling_not_used:
              message: "端点接受了 tools 参数，但模型返回了文本，而没有调用健康检查工具。AI 助手必须通过工具调用读取财务数据，否则聊天可能没有回答或编造数字。建议选择提供商文档明确支持工具调用的模型。"
              title: "模型没有调用所请求的工具"
            function_calling_unsupported:
              message: "端点可以处理普通聊天请求，但拒绝了携带 tools 参数的请求。AI 助手需要通过工具调用读取账户、交易和持仓；如果模型不支持工具调用，聊天会持续失败（常见为 404）。请选择其提供商文档明确支持工具调用的模型。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "模型不支持工具调用"
            llm_model_not_available:
              message: "端点有响应，但未列出或提供所配置的模型。请选择该提供商的可用模型后重试。若通过兼容 OpenAI 的转换层调用 Gemini，请使用当前支持的模型，例如 gemini-2.5-flash。"
              title: "配置的 AI 模型不可用"
            llm_probe_failed:
              message: "Sure 无法验证配置的端点和模型。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "LLM 实时检查失败"
            missing_vector_store:
              message: "配置向量存储适配器及其所需条件前，无法为上传文档建立索引或搜索。"
              title: "未配置向量存储"
            pdf_text_extraction_failed:
              message: "Sure 无法完成文本优先流程：在本地提取嵌入式 PDF 文本并发送给所配置的模型。没有发送任何客户数据。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "模拟 PDF 文本提取检查失败"
            pdf_vision_processing_failed:
              message: "Sure 无法通过所配置的模型完成图像或原生文档 PDF 流程。未发送任何客户数据。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "模拟 PDF 视觉/原生处理检查失败"
            pgvector_extension_not_enabled:
              message: "已选择 pgvector 适配器，但此数据库尚未启用向量扩展。请使用包含 pgvector 的 PostgreSQL 镜像，再以数据库所有者或超级用户启用扩展，并使用 VECTOR_STORE_PROVIDER=pgvector 重新运行迁移。"
              title: "未启用 PostgreSQL 向量扩展"
            pgvector_probe_failed:
              message: "Sure 无法查询 pgvector 分块表。请检查 PostgreSQL 权限、向量扩展和 vector_store_chunks 迁移。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "pgvector 存储检查失败"
            pgvector_table_not_found:
              message: "pgvector 扩展已启用，但未找到分块表。请检查迁移状态，然后使用 VECTOR_STORE_PROVIDER=pgvector 重新运行向量存储迁移，以便 Sure 创建 vector_store_chunks 表。"
              title: "缺少 vector_store_chunks 表"
            qdrant:
              message: "Qdrant 适配器目前只有框架，文档上传和搜索会失败。请为文档搜索选择 OpenAI 或 pgvector。"
              title: "尚未实现 Qdrant 支持"
            unavailable_vector_store:
              message: "检查适配器要求。使用 pgvector 时，数据库必须提供 vector 扩展或已有的 vector_store_chunks 表。"
              title: "所选向量存储不可用"
            vector_probe_failed:
              message: "Sure 无法验证所选向量存储及所有必需的嵌入服务。失败记录在“设置 → 调试日志”和 Rails.logger 中。"
              title: "文档搜索实时检查失败"
