              env_backed: "嵌入配置以及仅通过环境变量设置的值，会在各容器启动时固定。Rails 无法更改其他容器的环境，因此更改这些值后，必须重启或重新创建 Web 和工作进程服务；仅重启其中一个的部署操作（例如部分发布、更新 Secret 但未重启 Pod）也无法应用新值。"
